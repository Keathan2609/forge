# FORGE — continuous integration.
#
# Three jobs, split by what they need rather than by what they do:
#
#   quality      lint, typecheck, unit tests, production build — no services, fast
#   integration  the same code against real PostgreSQL and Redis
#   docker       proves every runtime image actually builds
#
# Integration tests are not merged into `quality` because they are an order of magnitude
# slower and need service containers; keeping them separate means a lint error is
# reported in ~2 minutes rather than ~8.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the previous run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  # Turborepo prints a warning without this and CI logs are noisy enough.
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches the pnpm store keyed on the lockfile.
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Prisma Client is a generated artifact: nothing that imports @forge/database
      # typechecks until it exists.
      - name: Generate Prisma Client
        run: pnpm --filter @forge/database exec prisma generate

      - name: Build packages
        run: pnpm turbo run build --filter=./packages/*

      - name: Lint
        run: pnpm exec eslint packages apps

      - name: Format check
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,mjs,json,md,yml,yaml}"

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build applications
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_FORGE_API_URL: http://localhost:4000

  integration:
    name: Integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Host ports deliberately match the local development stack (infra/docker/
    # docker-compose.yml maps 5435 and 6381 so FORGE can run alongside an existing local
    # PostgreSQL or Redis). Keeping CI on the same ports means the integration suites'
    # own fallback defaults are correct here too, so a missing variable degrades to the
    # right endpoint instead of a confusing one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Disposable, CI-only. The suites truncate and recreate everything they touch.
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          # Created at first boot, which is the half of `pnpm test:setup` that CI needs;
          # the other half of that script shells into a container named `forge-postgres`,
          # which does not exist on a runner.
          POSTGRES_DB: forge_test
        ports:
          - 5435:5432
        # Without a healthcheck the job races the database's first-boot initialisation.
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # What the integration suites read. These reach the test process only because
      # `test:integration` declares them in turbo.json — Turborepo runs tasks in strict
      # env mode and silently strips anything undeclared.
      TEST_DATABASE_URL: postgresql://forge:forge@localhost:5435/forge_test?schema=public
      TEST_REDIS_URL: redis://localhost:6381/1
      # What `prisma migrate deploy` reads. Pointed at the same test database, so the
      # schema the suites run against is the one migrations just produced.
      DATABASE_URL: postgresql://forge:forge@localhost:5435/forge_test?schema=public
      REDIS_URL: redis://localhost:6381

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm exec`, never `npx`: npx with no local binary downloads whatever the
      # registry currently publishes, which is how a next-major release candidate once
      # ended up running here.
      - name: Generate Prisma Client
        run: pnpm --filter @forge/database exec prisma generate

      # The CI equivalent of `pnpm test:setup`. That script creates the database and
      # applies migrations; the service container above already created it, so only the
      # migration half applies on a runner.
      - name: Apply migrations to the test database
        run: pnpm --filter @forge/database exec prisma migrate deploy

      # A dependency-free reachability probe on both mapped ports. If a service port is
      # ever remapped without updating the URLs above, this fails here with an obvious
      # message instead of 90 seconds later inside a test suite.
      - name: Verify services are reachable
        run: |
          node -e "
          const net = require('net');
          const check = (port, name) => new Promise((res, rej) => {
            const s = net.connect(port, '127.0.0.1');
            s.setTimeout(5000);
            s.on('connect', () => { s.end(); res(name + ' reachable on ' + port); });
            s.on('timeout', () => { s.destroy(); rej(new Error(name + ' timed out on ' + port)); });
            s.on('error', (e) => rej(new Error(name + ' unreachable on ' + port + ': ' + e.message)));
          });
          Promise.all([check(5435, 'postgres'), check(6381, 'redis')])
            .then((r) => r.forEach((line) => console.log(line)))
            .catch((e) => { console.error(e.message); process.exit(1); });
          "

      - name: Build packages
        run: pnpm turbo run build --filter=./packages/*

      # These are the tests that exercise leasing, recovery, idempotency and the outbox
      # against real infrastructure — the behaviour the project is actually about.
      # `--concurrency=1`: the suites share one test database and one Redis index, and
      # each asserts on exact state. In parallel, one suite's control plane advances the
      # other's runs and claims its tasks.
      - name: Integration tests
        run: pnpm turbo run test:integration --concurrency=1

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No point building images for a tree that does not lint or typecheck.
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, scheduler, web, migrator]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          # Built to verify the Dockerfile, not published — this repository has no
          # registry configured, and claiming otherwise would be theatre.
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
