# Single-replica Redis. FORGE tolerates losing it — Redis carries messages, never state —
# but a failover stalls dispatch until it recovers. See README.md.
apiVersion: v1
kind: Service
metadata:
  name: forge-redis
  namespace: forge
  labels: { app.kubernetes.io/component: redis, app.kubernetes.io/part-of: forge }
spec:
  selector: { app.kubernetes.io/component: redis }
  ports: [{ port: 6379, targetPort: 6379, name: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-redis
  namespace: forge
  labels: { app.kubernetes.io/component: redis, app.kubernetes.io/part-of: forge }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: forge
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999 }
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - 'yes'
            - --maxmemory
            - 512mb
            # `noeviction` rather than an LRU policy: silently evicting queued messages
            # would turn memory pressure into lost dispatches.
            - --maxmemory-policy
            - noeviction
          ports: [{ containerPort: 6379, name: redis }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 768Mi }
          readinessProbe:
            exec: { command: ['redis-cli', 'ping'] }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec: { command: ['redis-cli', 'ping'] }
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          emptyDir: {}
