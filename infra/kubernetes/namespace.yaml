apiVersion: v1
kind: Namespace
metadata:
  name: forge
  labels:
    app.kubernetes.io/name: forge
    # Enforce the restricted Pod Security Standard: no privilege escalation, non-root,
    # dropped capabilities. Every FORGE container already complies.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# Default-deny ingress, then allow only what is needed. Without this, a compromised pod
# anywhere in the cluster can reach PostgreSQL directly and bypass every guarantee the
# application layer provides.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: forge
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datastores-from-forge
  namespace: forge
spec:
  # PostgreSQL and Redis accept connections only from FORGE's own pods.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [postgres, redis]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: forge
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-to-services
  namespace: forge
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, web]
  policyTypes: [Ingress]
  ingress:
    # Deliberately open: an Ingress controller lives in another namespace, and pinning
    # it here would couple this manifest to a specific controller install.
    - {}
